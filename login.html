<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Virtual Palato Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8C96A;
      --dark: #0A0A0A;
      --dark2: #111111;
      --dark3: #1A1A1A;
      --text: #F0EDE8;
      --muted: #9A9080;
      --border: rgba(201,168,76,0.2);
      --error: #EF4444;
      --success: #22C55E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    /* Background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(201,168,76,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 80% 80%, rgba(201,168,76,0.04) 0%, transparent 50%);
      pointer-events: none;
    }
    .login-card {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      justify-content: center;
    }
    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }
    .logo-text span { color: var(--gold); }
    .login-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 6px;
    }
    .login-subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      background: var(--dark3);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
    }
    input::placeholder { color: rgba(255,255,255,0.2); }
    .btn-login {
      width: 100%;
      background: var(--gold);
      color: var(--dark);
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }
    .btn-login:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-login .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: var(--dark);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 20px;
      display: none;
    }
    .alert.error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #FCA5A5;
      display: block;
    }
    .alert.success {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      color: #86EFAC;
      display: block;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--gold); }
    .setup-hint {
      background: rgba(201,168,76,0.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 20px;
      display: none;
    }
    .setup-hint strong { color: var(--gold); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <svg width="32" height="32" viewBox="0 0 38 38" fill="none">
        <circle cx="19" cy="19" r="18" stroke="#C9A84C" stroke-width="1.5"/>
        <path d="M19 7 C14.5 7 10 11.5 10 16.5 C10 22.5 14.5 26 19 28 C23.5 26 28 22.5 28 16.5 C28 11.5 23.5 7 19 7Z" fill="none" stroke="#C9A84C" stroke-width="1.3"/>
        <path d="M11.5 16.5 Q19 21 26.5 16.5" stroke="#C9A84C" stroke-width="0.9" fill="none"/>
        <path d="M19 28 L19 33" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M15 33 L23 33" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">Virtual <span>Palato</span></span>
    </div>

    <h1 class="login-title">Área Administrativa</h1>
    <p class="login-subtitle">Acesso restrito — apenas colaboradores autorizados</p>

    <div class="alert" id="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" placeholder="seu usuário" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">
        <span class="btn-text">Entrar no Dashboard</span>
        <div class="spinner"></div>
      </button>
    </form>

    <div class="setup-hint" id="setupHint">
      <strong>Primeiro acesso?</strong> Configure suas credenciais no arquivo <code>admin/config.js</code> do repositório.
    </div>

    <a href="/" class="back-link">← Voltar ao site</a>
  </div>

  <script>
    // ─── Auth Config ───────────────────────────────────────────────────────────
    // Credenciais armazenadas como hash SHA-256 para segurança básica
    // Para alterar: gere o hash em https://emn178.github.io/online-tools/sha256.html
    // Usuário padrão: sergio | Senha padrão: vpalato2025
    const ADMIN_CONFIG = {
      users: [
        {
          username: 'sergio',
          // SHA-256 de "vpalato2025"
          passwordHash: '87ca5fd54365a5faf5009d63d26b1c8be779f2a0120c5c2b8b2aa9685f9db21b',
          name: 'Sergio Nedal',
          role: 'admin'
        }
      ],
      // Token expira em 8 horas
      sessionHours: 8
    };

    // ─── Helpers ───────────────────────────────────────────────────────────────
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function showAlert(msg, type = 'error') {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = `alert ${type}`;
    }

    function hideAlert() {
      document.getElementById('alert').className = 'alert';
    }

    // ─── Login ─────────────────────────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const btn = document.getElementById('btnLogin');
      btn.classList.add('loading');
      btn.disabled = true;

      const username = document.getElementById('username').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      // Simula delay de rede para evitar brute force visual
      await new Promise(r => setTimeout(r, 600));

      try {
        const hash = await sha256(password);
        const user = ADMIN_CONFIG.users.find(
          u => u.username === username && u.passwordHash === hash
        );

        if (!user) {
          showAlert('Usuário ou senha incorretos. Tente novamente.');
          btn.classList.remove('loading');
          btn.disabled = false;
          return;
        }

        // Cria sessão
        const session = {
          username: user.username,
          name: user.name,
          role: user.role,
          expires: Date.now() + (ADMIN_CONFIG.sessionHours * 60 * 60 * 1000)
        };
        localStorage.setItem('vp_admin_session', JSON.stringify(session));

        showAlert('Login realizado! Redirecionando...', 'success');
        setTimeout(() => {
          const redirect = new URLSearchParams(window.location.search).get('redirect') || '/admin/';
          window.location.href = redirect;
        }, 800);

      } catch (err) {
        showAlert('Erro ao processar login. Tente novamente.');
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });

    // ─── Auto-redirect se já logado ────────────────────────────────────────────
    (function checkExistingSession() {
      try {
        const session = JSON.parse(localStorage.getItem('vp_admin_session') || 'null');
        if (session && session.expires > Date.now()) {
          const redirect = new URLSearchParams(window.location.search).get('redirect') || '/admin/';
          window.location.href = redirect;
        }
      } catch(e) {}
    })();
  </script>
</body>
</html>
