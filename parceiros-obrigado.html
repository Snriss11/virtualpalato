<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Recebido — Virtual Palato</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --gold:#C9A84C; --dark:#0A0A0A; --dark2:#111111; --text:#F0EDE8; --text-muted:#9A9080; --font-serif:'Playfair Display',Georgia,serif; --font-sans:'Inter',system-ui,sans-serif; }
    *{box-sizing:border-box;margin:0;padding:0} body{background:var(--dark);color:var(--text);font-family:var(--font-sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    a{color:inherit;text-decoration:none}
    .card{max-width:520px;width:100%;text-align:center;background:var(--dark2);border:1px solid rgba(201,168,76,0.2);border-radius:24px;padding:56px 48px;position:relative;overflow:hidden}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
    .icon{font-size:4rem;margin-bottom:24px}
    h1{font-family:var(--font-serif);font-size:2.2rem;font-weight:900;margin-bottom:16px}
    h1 em{font-style:italic;color:var(--gold)}
    p{color:var(--text-muted);font-size:1rem;line-height:1.75;margin-bottom:32px}
    .btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--dark);font-weight:700;font-size:0.9rem;padding:14px 28px;border-radius:30px;transition:all 0.3s}
    .btn:hover{background:#E8C96A;transform:translateY(-2px)}
    .note{font-size:0.8rem;color:var(--text-muted);margin-top:20px}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>Cadastro <em>recebido!</em></h1>
    <p>Obrigado pelo interesse em ser parceiro do Virtual Palato Marketplace. Nossa equipe vai analisar seu cadastro e entrar em contato em até <strong style="color:var(--text)">48 horas</strong> pelo e-mail ou WhatsApp informado.</p>
    <a href="/" class="btn">← Voltar ao site</a>
    <p class="note">Dúvidas? Escreva para <a href="mailto:sergio@virtualpalato.com" style="color:var(--gold)">sergio@virtualpalato.com</a></p>
  </div>
</body>
</html>
