<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Conta | Virtual Palato</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --gold: #C9A84C; --gold-light: #E8C97A;
      --dark: #0d0d0d; --dark-2: #1a1a1a; --dark-3: #242424;
      --text: #f0ece4; --text-muted: #9a9080;
      --border: rgba(201,168,76,0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--dark); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(13,13,13,0.95); border-bottom: 1px solid var(--border);
      padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; }
    .nav-logo .gold { color: var(--gold); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .btn-logout { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 0.4rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    .btn-logout:hover { border-color: var(--gold); color: var(--text); }

    .account-page { padding: 100px 2rem 4rem; max-width: 900px; margin: 0 auto; }

    .account-header { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2.5rem; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; background: rgba(201,168,76,0.15); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .account-info h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 0.3rem; }
    .account-info p { color: var(--text-muted); font-size: 0.9rem; }
    .badge { display: inline-block; padding: 0.2rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-left: 0.5rem; }
    .badge-visitor { background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid rgba(201,168,76,0.3); }
    .badge-pending { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
    .badge-approved { background: rgba(82,192,122,0.15); color: #52c07a; border: 1px solid rgba(82,192,122,0.3); }

    .account-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
    .account-tab { padding: 0.75rem 1.5rem; background: transparent; border: none; color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; margin-bottom: -1px; }
    .account-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: var(--dark-2); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .card h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; margin-bottom: 1rem; color: var(--gold); }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.4rem; }
    .form-group input, .form-group textarea { width: 100%; background: var(--dark-3); border: 1.5px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--gold); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn-save { background: var(--gold); color: var(--dark); border: none; border-radius: 10px; padding: 0.75rem 2rem; font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-save:hover { background: var(--gold-light); }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .empty-state p { font-size: 0.9rem; line-height: 1.6; }
    .empty-state a { color: var(--gold); text-decoration: none; }

    .favorite-item { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
    .favorite-item:last-child { border-bottom: none; }
    .favorite-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: var(--dark-3); flex-shrink: 0; }
    .favorite-info { flex: 1; }
    .favorite-info .title { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.2rem; }
    .favorite-info .category { font-size: 0.78rem; color: var(--gold); }
    .btn-remove { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: 0.3rem; transition: color 0.2s; }
    .btn-remove:hover { color: #e05252; }

    .purchase-item { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
    .purchase-item:last-child { border-bottom: none; }
    .purchase-info .name { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.2rem; }
    .purchase-info .date { font-size: 0.78rem; color: var(--text-muted); }
    .purchase-right { text-align: right; }
    .purchase-price { font-weight: 700; color: var(--gold); font-size: 0.95rem; }
    .btn-download { display: inline-block; margin-top: 0.3rem; padding: 0.3rem 0.8rem; background: rgba(201,168,76,0.1); border: 1px solid var(--border); border-radius: 6px; color: var(--gold); font-size: 0.78rem; text-decoration: none; transition: all 0.2s; }
    .btn-download:hover { background: rgba(201,168,76,0.2); }

    .collab-cta { background: linear-gradient(135deg, rgba(201,168,76,0.1), rgba(201,168,76,0.05)); border: 1px solid rgba(201,168,76,0.3); border-radius: 16px; padding: 2rem; text-align: center; }
    .collab-cta h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 0.75rem; }
    .collab-cta p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn-collab { display: inline-block; background: var(--gold); color: var(--dark); padding: 0.75rem 2rem; border-radius: 10px; font-weight: 700; text-decoration: none; transition: all 0.2s; }
    .btn-collab:hover { background: var(--gold-light); }

    .loading { text-align: center; padding: 3rem; color: var(--text-muted); }

    @media (max-width: 600px) {
      .account-header { flex-direction: column; text-align: center; }
      .form-row { grid-template-columns: 1fr; }
      .account-tab { padding: 0.75rem 1rem; font-size: 0.82rem; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-logo">
    <svg width="32" height="32" viewBox="0 0 38 38" fill="none">
      <circle cx="19" cy="19" r="18" stroke="#C9A84C" stroke-width="1.5"/>
      <path d="M19 7 C14.5 7 10 11.5 10 16.5 C10 22.5 14.5 26 19 28 C23.5 26 28 22.5 28 16.5 C28 11.5 23.5 7 19 7Z" fill="none" stroke="#C9A84C" stroke-width="1.3"/>
      <path d="M11.5 16.5 Q19 21 26.5 16.5" stroke="#C9A84C" stroke-width="0.9" fill="none"/>
      <path d="M19 28 L19 33" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M15 33 L23 33" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span>Virtual <span class="gold">Palato</span></span>
  </a>
  <div class="nav-right">
    <span id="navUserName" style="font-size:0.85rem;color:var(--text-muted)"></span>
    <button class="btn-logout" onclick="handleLogout()">Sair</button>
  </div>
</nav>

<main class="account-page" id="accountPage" style="display:none">

  <div class="account-header">
    <div class="avatar" id="userAvatar">👤</div>
    <div class="account-info">
      <h1 id="userName">Carregando...</h1>
      <p id="userEmail" style="color:var(--text-muted)"></p>
      <span id="userBadge" class="badge badge-visitor">Visitante</span>
    </div>
  </div>

  <div class="account-tabs">
    <button class="account-tab active" onclick="switchAccountTab('perfil')">Perfil</button>
    <button class="account-tab" onclick="switchAccountTab('favoritos')">❤️ Favoritos</button>
    <button class="account-tab" onclick="switchAccountTab('compras')">🛒 Compras</button>
    <button class="account-tab" onclick="switchAccountTab('colaborador')">✍️ Colaborador</button>
  </div>

  <!-- PERFIL -->
  <div class="tab-content active" id="tab-perfil">
    <div class="card">
      <h3>Informações Pessoais</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Nome completo</label>
          <input type="text" id="profileName" placeholder="Seu nome">
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="profileUsername" placeholder="@seuusername">
        </div>
      </div>
      <div class="form-group">
        <label>Bio</label>
        <textarea id="profileBio" placeholder="Conte um pouco sobre você..." rows="3"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Instagram</label>
          <input type="text" id="profileInstagram" placeholder="@seuinstagram">
        </div>
        <div class="form-group">
          <label>Website</label>
          <input type="text" id="profileWebsite" placeholder="https://seusite.com">
        </div>
      </div>
      <button class="btn-save" onclick="saveProfile()">Salvar Alterações</button>
    </div>
  </div>

  <!-- FAVORITOS -->
  <div class="tab-content" id="tab-favoritos">
    <div class="card">
      <h3>Receitas & Posts Favoritos</h3>
      <div id="favoritesContent">
        <div class="loading">Carregando...</div>
      </div>
    </div>
  </div>

  <!-- COMPRAS -->
  <div class="tab-content" id="tab-compras">
    <div class="card">
      <h3>Histórico de Compras</h3>
      <div id="purchasesContent">
        <div class="loading">Carregando...</div>
      </div>
    </div>
  </div>

  <!-- COLABORADOR -->
  <div class="tab-content" id="tab-colaborador">
    <div id="collabContent">
      <div class="loading">Carregando...</div>
    </div>
  </div>

</main>

<div id="loadingPage" style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-muted)">
  Carregando...
</div>

<script>
  const SUPABASE_URL = 'https://xolqaabadtliocrgqhpf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Fgxml2IgRneWFndQrBFBgg_BHWskrDc';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentProfile = null;

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      window.location.href = '/entrar.html';
      return;
    }
    currentUser = session.user;

    const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
    currentProfile = profile;

    // Preencher UI
    document.getElementById('navUserName').textContent = profile?.full_name || currentUser.email;
    document.getElementById('userName').textContent = profile?.full_name || 'Usuário';
    document.getElementById('userEmail').textContent = currentUser.email;

    if (profile?.avatar_url) {
      document.getElementById('userAvatar').innerHTML = `<img src="${profile.avatar_url}" alt="Avatar">`;
    }

    // Badge
    const badge = document.getElementById('userBadge');
    if (profile?.role === 'collaborator') {
      if (profile.collaborator_status === 'approved') {
        badge.textContent = 'Colaborador'; badge.className = 'badge badge-approved';
      } else if (profile.collaborator_status === 'pending') {
        badge.textContent = 'Aguardando aprovação'; badge.className = 'badge badge-pending';
      }
    }

    // Preencher form de perfil
    document.getElementById('profileName').value = profile?.full_name || '';
    document.getElementById('profileUsername').value = profile?.username || '';
    document.getElementById('profileBio').value = profile?.bio || '';
    document.getElementById('profileInstagram').value = profile?.social_instagram || '';
    document.getElementById('profileWebsite').value = profile?.website || '';

    // Mostrar página
    document.getElementById('loadingPage').style.display = 'none';
    document.getElementById('accountPage').style.display = 'block';

    loadFavorites();
    loadPurchases();
    loadCollabSection();
  }

  async function loadFavorites() {
    const { data: favs } = await sb.from('favorites').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
    const el = document.getElementById('favoritesContent');
    if (!favs || favs.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">❤️</div><p>Você ainda não salvou nenhuma receita como favorita.<br><a href="/">Explorar receitas</a></p></div>`;
      return;
    }
    el.innerHTML = favs.map(f => `
      <div class="favorite-item">
        ${f.post_image ? `<img class="favorite-thumb" src="${f.post_image}" alt="${f.post_title}">` : '<div class="favorite-thumb" style="display:flex;align-items:center;justify-content:center;font-size:1.5rem">🍽️</div>'}
        <div class="favorite-info">
          <div class="title"><a href="/posts/${f.post_slug}/" style="color:var(--text);text-decoration:none">${f.post_title || f.post_slug}</a></div>
          <div class="category">${f.post_category || 'Receita'}</div>
        </div>
        <button class="btn-remove" onclick="removeFavorite('${f.post_slug}')" title="Remover">✕</button>
      </div>
    `).join('');
  }

  async function removeFavorite(slug) {
    await sb.from('favorites').delete().eq('user_id', currentUser.id).eq('post_slug', slug);
    loadFavorites();
  }

  async function loadPurchases() {
    const { data: purchases } = await sb.from('purchases').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
    const el = document.getElementById('purchasesContent');
    if (!purchases || purchases.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">🛒</div><p>Você ainda não fez nenhuma compra.<br><a href="/loja.html">Visitar a loja</a></p></div>`;
      return;
    }
    el.innerHTML = purchases.map(p => `
      <div class="purchase-item">
        <div class="purchase-info">
          <div class="name">${p.product_name}</div>
          <div class="date">${new Date(p.created_at).toLocaleDateString('pt-BR')} · ${p.product_type || 'Produto digital'}</div>
        </div>
        <div class="purchase-right">
          <div class="purchase-price">R$ ${parseFloat(p.amount || 0).toFixed(2).replace('.', ',')}</div>
          ${p.download_url ? `<a href="${p.download_url}" class="btn-download" target="_blank">⬇ Baixar</a>` : ''}
        </div>
      </div>
    `).join('');
  }

  function loadCollabSection() {
    const el = document.getElementById('collabContent');
    const role = currentProfile?.role;
    const status = currentProfile?.collaborator_status;

    if (role === 'collaborator' && status === 'approved') {
      el.innerHTML = `
        <div class="collab-cta" style="background:linear-gradient(135deg,rgba(82,192,122,0.1),rgba(82,192,122,0.05));border-color:rgba(82,192,122,0.3)">
          <h3>✅ Conta de Colaborador Aprovada!</h3>
          <p>Você tem acesso ao painel de colaborador onde pode criar posts, gerenciar sua coluna exclusiva e fazer lives.</p>
          <a href="/colaborador/" class="btn-collab">Acessar Painel do Colaborador</a>
        </div>`;
    } else if (role === 'collaborator' && status === 'pending') {
      el.innerHTML = `
        <div class="collab-cta" style="background:linear-gradient(135deg,rgba(251,191,36,0.1),rgba(251,191,36,0.05));border-color:rgba(251,191,36,0.3)">
          <h3>⏳ Solicitação em Análise</h3>
          <p>Sua solicitação para se tornar colaborador está sendo analisada pela equipe do Virtual Palato. Você receberá um e-mail com a resposta em até 48 horas.</p>
        </div>`;
    } else {
      el.innerHTML = `
        <div class="collab-cta">
          <h3>Torne-se um Colaborador</h3>
          <p>Publique receitas, roteiros e artigos no Virtual Palato. Crie sua coluna exclusiva, faça lives e alcance nossa audiência apaixonada por gastronomia.</p>
          <a href="/entrar.html?tab=register&role=collaborator" class="btn-collab">Solicitar Acesso de Colaborador</a>
        </div>`;
    }
  }

  async function saveProfile() {
    const { error } = await sb.from('profiles').update({
      full_name: document.getElementById('profileName').value,
      username: document.getElementById('profileUsername').value,
      bio: document.getElementById('profileBio').value,
      social_instagram: document.getElementById('profileInstagram').value,
      website: document.getElementById('profileWebsite').value,
      updated_at: new Date().toISOString()
    }).eq('id', currentUser.id);

    if (error) {
      alert('Erro ao salvar: ' + error.message);
    } else {
      alert('✅ Perfil atualizado com sucesso!');
    }
  }

  async function handleLogout() {
    await sb.auth.signOut();
    window.location.href = '/';
  }

  function switchAccountTab(tab) {
    document.querySelectorAll('.account-tab').forEach((t, i) => {
      const tabs = ['perfil', 'favoritos', 'compras', 'colaborador'];
      t.classList.toggle('active', tabs[i] === tab);
    });
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
  }

  init();
</script>
</body>
</html>
